services:
  - type: web
    name: lexforge-api
    env: node
    rootDir: products/LexForge/nid-extractor
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    region: oregon
    disk:
      name: lexforge-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
