name: LexForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - run: npm install
    - run: npm run lint --workspace=products/LexForge/web
    - run: npx tsc --noEmit -p products/LexForge/web/tsconfig.json
    - run: npm run build --workspace=products/LexForge/web
